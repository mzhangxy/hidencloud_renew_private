name: Diagnostic Cookie Login (No Proxy)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install DrissionPage requests

      # 删除了 Xray 代理步骤

      - name: 执行裸连诊断
        env:
          HIDENCLOUD_COOKIE_1: ${{ secrets.HIDENCLOUD_COOKIE_1 }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python test_cookie_gha.py

      - name: 上传诊断截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-screenshot-noproxy
          path: ./*.png
