name: HidenCloud Auto Renew

on:
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_PROXY: ${{ secrets.PROXY_NODE != '' }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装核心依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install DrissionPage requests pynacl

      - name: 🚇 启动 Gost 代理隧道
        if: env.HAS_PROXY == 'true'
        env:
          PROXY_NODE: ${{ secrets.PROXY_NODE }} 
        run: |
          wget -qO- https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz | gzip -d > gost
          chmod +x gost
          
          # 💡修复 1：加上双引号 "$PROXY_NODE"，防止复杂链接中的特殊字符截断命令
          nohup ./gost -L=socks5://127.0.0.1:10808 -F="$PROXY_NODE" > gost.log 2>&1 &
          
          sleep 2
          
          echo "测试 Gost 隧道连通性..."
          curl -x socks5h://127.0.0.1:10808 https://api.ipify.org
          echo ""
          
          # 💡修复 2：如果 Gost 成功启动，动态将 PROXY 变量注入到全局环境变量中
          echo "PROXY=socks5://127.0.0.1:10808" >> $GITHUB_ENV

      - name: 🚀 执行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          # 💡修复 3：删除了这里的 PROXY 硬编码，交由上面的步骤动态决定
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          HIDENCLOUD_COOKIE_1: ${{ secrets.HIDENCLOUD_COOKIE_1 }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scripts/hidencloud_renew.py

      - name: 📤 收集错误截图 (仅排错用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: ./*.png
          retention-days: 3
