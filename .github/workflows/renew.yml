name: HidenCloud Auto Renew

on:
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_PROXY: ${{ secrets.PROXY_NODE != '' }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装核心依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install DrissionPage requests pynacl

      - name: 🚇 启动 Gost 代理隧道
        if: env.HAS_PROXY == 'true'
        env:
          # 假设在 Secrets 中存了类似 socks5://user:pass@ip:port 的节点链接
          PROXY_NODE: ${{ secrets.PROXY_NODE }} 
        run: |
          # 1. 下载最新版的 gost (Linux 64位)
          wget -qO- https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz | gzip -d > gost
          chmod +x gost
          
          # 2. 后台启动 gost：在本地 10808 端口开启 SOCKS5 服务，并转发到你的远端节点
          nohup ./gost -L=socks5://127.0.0.1:10808 -F=$PROXY_NODE > gost.log 2>&1 &
          
          # 3. 给它 2 秒钟的启动时间
          sleep 2
          
          # 4. 探针自检：测试代理是否连通，打印出伪装后的出口 IP
          echo "测试 Gost 隧道连通性..."
          curl -x socks5h://127.0.0.1:10808 https://api.ipify.org
          echo ""

      - name: 🚀 执行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          PROXY: 'socks5://127.0.0.1:10808'
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          HIDENCLOUD_COOKIE_1: ${{ secrets.HIDENCLOUD_COOKIE_1 }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scripts/hidencloud_renew.py

      - name: 📤 收集错误截图 (仅排错用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: ./*.png
          retention-days: 3
